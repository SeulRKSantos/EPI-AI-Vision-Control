; EPI-AI-Vision-Control — gate firmware
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
; Tests:   pio test -e native      (state machine, no board required)
;
; Hardware bring-up (reader, relay and LEDs, no network):
;          pio run -e hwtest -t upload && pio device monitor -e hwtest

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    miguelbalboa/MFRC522@^1.4.12
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall
    -Wextra

; The bring-up program lives in src/hwtest and must stay out of the gate build.
build_src_filter = +<*> -<hwtest/>

; Bench test for the wiring: reads cards with the same driver the gate uses,
; drives the relay pin by hand and blinks the LEDs. Needs no config.h and no
; network, so it can run before anything else is set up.
[env:hwtest]
extends = env:esp32dev
build_src_filter = +<hwtest/> +<rfid.cpp>

; The state machine carries the safety rules and has no Arduino dependency,
; so it is tested on the host — no board, no flashing, no waiting.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I src
test_filter = test_access_state
; The state machine is the only source with no Arduino dependency; build it
; with the tests and leave the board code out.
test_build_src = yes
build_src_filter = +<access_state.cpp>
