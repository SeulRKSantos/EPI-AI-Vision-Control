; EPI-AI-Vision-Control — gate firmware
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
; Tests:   pio test -e native      (state machine, no board required)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    miguelbalboa/MFRC522@^1.4.12
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall
    -Wextra

; The state machine carries the safety rules and has no Arduino dependency,
; so it is tested on the host — no board, no flashing, no waiting.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I src
test_filter = test_access_state
