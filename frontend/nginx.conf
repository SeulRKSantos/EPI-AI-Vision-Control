server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The panel is a single-page application: every path has to reach
    # index.html so the router can resolve it. Without this, reloading on
    # /historico would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
